# Configuration cargo-deny — audits de chaîne d'approvisionnement (CI: ci.yml,
# local: ci.sh si le binaire est installé).
#
# La liste de licences a d'abord été écrite large, faute de pouvoir exécuter
# `cargo deny check` sur la machine de dev. Ce n'est plus le cas : la commande
# a été lancée localement à l'intégration de ML-KEM (jalon 2) et passe
# (advisories, bans, licenses, sources). La famille RustCrypto arrivée avec
# `ml-kem` (kem, hybrid-array, module-lattice, sha3, keccak, cmov, ctutils) est
# en Apache-2.0 OR MIT, déjà couverte.
#
# Règle d'entretien : une entrée ne s'ajoute que pour une dépendance légitime
# effectivement rejetée, avec la raison écrite au-dessus. Elle ne se retire pas
# sur l'intuition qu'elle est inutile — `cargo deny check` doit le confirmer.

[advisories]
# Vulnérabilités connues (RUSTSEC) et code `unsound` restent des ERREURS qui
# bloquent la publication. En revanche :
# - `unmaintained = "workspace"` : ne bloque QUE sur un crate non maintenu dont
#   NOUS dépendons directement (actionnable). Les crates non maintenus tirés
#   transitivement par Tauri/GTK/Opus (gtk-rs, audiopus_sys, unic-*, paste,
#   instant, proc-macro-error…) sont hors de notre contrôle : signalés sans
#   faire échouer la CI, sinon la release serait bloquée par des dépendances
#   qu'on ne maîtrise pas.
# - `yanked = "warn"` : un crate retiré rencontré en transitif (ex. spin) est
#   signalé mais ne bloque pas une publication.
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Seules les licences permissives (ou faiblement copyleft compatibles) sont
# acceptées ; tout SPDX hors liste fait échouer la CI.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  # OpenSSL vendu par openssl-src (rusqlite bundled-sqlcipher-vendored-openssl)
  # et licence historique de ring si ce crate entre dans l'arbre un jour.
  "OpenSSL",
  # Magasin de certificats racines Mozilla (webpki-root-certs, tiré par
  # rustls via reqwest — chaîne HTTPS de tauri-plugin-updater, D-049) :
  # licence permissive de données, sans obligation sur le code.
  "CDLA-Permissive-2.0",
]

[bans]
# Les versions multiples d'un même crate gonflent le binaire mais ne sont pas
# une erreur : avertissement seulement.
multiple-versions = "warn"

# 🔒 Post-quantique : une seule implémentation ML-KEM entre dans l'arbre, et
# c'est `ml-kem` (RustCrypto, zéro `unsafe`) — voir la tête de
# `crates/accord-crypto/src/pq.rs` pour les mesures qui l'ont départagée.
#
# Les entrées ci-dessous ne sont pas décoratives : `pqc_kyber` porte
# RUSTSEC-2023-0079 (« KyberSlash », récupération de clé par canal auxiliaire
# temporel) et n'est plus maintenu. Il reste le premier résultat quand on
# cherche « kyber rust », donc le garde-fou vise moins l'aujourd'hui que le
# contributeur pressé de demain. `safe_pqc_kyber` en est un fork correctif,
# mais implémente Kyber d'avant la normalisation, pas ML-KEM de FIPS 203 :
# l'admettre reviendrait à faire cohabiter deux définitions du même échange.
[[bans.deny]]
name = "pqc_kyber"

[[bans.deny]]
name = "safe_pqc_kyber"
